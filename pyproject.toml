[project]
name = "vllm-local-lab"
version = "0.1.0"
description = "A local-first practical vLLM learning project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
serve = [
    "vllm>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
